name: CI

on: [push, pull_request]

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime (Linux, PyPI wheel + jsDelivr headers)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip download onnxruntime --no-deps --only-binary=:all: -d ort_pkg -q
          python3 tools/extract_ort.py ort_pkg ort
          mkdir -p ort/include
          cp -r third_party/onnxruntime/include/onnxruntime ort/include/
          ls -la ort/lib ort/include

      - name: Download ONNX Runtime (Windows, NuGet)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $idx = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/index.json"
          $ver = $idx.versions[-1]
          Write-Output "ONNX Runtime NuGet version: $ver"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ver/microsoft.ml.onnxruntime.$ver.nupkg" -OutFile ort.nupkg
          Expand-Archive ort.nupkg -DestinationPath ort_nuget
          New-Item -ItemType Directory -Force ort\lib, ort\include | Out-Null
          $dll = Get-ChildItem -Recurse ort_nuget -Filter onnxruntime.dll | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          $lib = Get-ChildItem -Recurse ort_nuget -Filter onnxruntime.lib | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          if (-not $lib) { $lib = Get-ChildItem -Recurse ort_nuget -Filter onnxruntime.lib | Select-Object -First 1 }
          Write-Output "dll: $($dll.FullName)"
          Write-Output "lib: $($lib.FullName)"
          if (-not $dll -or -not $lib) { Get-ChildItem -Recurse ort_nuget | Select-Object FullName; Write-Error "onnxruntime.dll/.lib not found in nupkg"; exit 1 }
          Copy-Item $dll.FullName ort\lib\
          Copy-Item $lib.FullName ort\lib\
          $hdrs = Get-ChildItem -Recurse ort_nuget -Filter onnxruntime_c_api.h | Select-Object -First 1
          if ($hdrs) { Copy-Item (Join-Path $hdrs.DirectoryName '*.h') ort\include\ } else { Copy-Item third_party\onnxruntime\include\onnxruntime\core\session\*.h ort\include\ }
          Get-ChildItem ort\lib, ort\include

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT="$PWD/ort"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 4

      - name: Run tests (GoogleTest)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run dlopen/LoadLibrary demo
        shell: bash
        run: |
          cd build
          export INFERCORE_LIB="$(pwd)/libinfercore.so"
          if [ "$RUNNER_OS" = "Windows" ]; then export INFERCORE_LIB="$(pwd)/Release/infercore.dll"; fi
          ./infercore_demo ../models/mnist_cnn.json ../models/mnist_fp32.weights ../models/mnist_int8.weights ../models/sample_demo.bin || \
          ./Release/infercore_demo ../models/mnist_cnn.json ../models/mnist_fp32.weights ../models/mnist_int8.weights ../models/sample_demo.bin

  sanitizers:
    name: asan-ubsan (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DINFERCORE_WITH_ONNX=OFF -DINFERCORE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests under ASan+UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  benchmark:
    name: benchmark (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ONNX Runtime (PyPI wheel + jsDelivr headers)
        run: |
          python3 -m pip download onnxruntime --no-deps --only-binary=:all: -d ort_pkg -q
          python3 tools/extract_ort.py ort_pkg ort
          mkdir -p ort/include
          cp -r third_party/onnxruntime/include/onnxruntime ort/include/
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT="$PWD/ort"
          cmake --build build -j 4
      - name: Download MNIST test set
        run: |
          mkdir -p models/mnist
          curl -fSL --retry 2 https://ossci-datasets.s3.amazonaws.com/mnist/t10k-images-idx3-ubyte.gz | gunzip > models/mnist/t10k-images-idx3-ubyte
          curl -fSL --retry 2 https://ossci-datasets.s3.amazonaws.com/mnist/t10k-labels-idx1-ubyte.gz | gunzip > models/mnist/t10k-labels-idx1-ubyte
      - name: Run benchmark
        run: |
          ./build/infercore_benchmark --models-dir models --iterations 1000 --eval-n 2000 --db bench_results.db 2>&1 | tee bench_results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench_results.txt
            bench_results.db
